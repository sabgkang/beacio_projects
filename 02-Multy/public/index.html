<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8faff">
  <meta name="description" content="Multy serial communication workspace for UART, I²C, and SPI.">
  <title>Multy · Serial communication assistant</title>
  <script src="/ios-style-mode.js?v=20261007-ios-style10"></script>
  <link rel="icon" href="/icons/multy.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <meta name="multy-frontend-build" content="20261007-ios-status14">
  <script type="module" src="/app.js?v=20261007-ios-status14"></script>
</head>
<body>
  <main class="workspace">
    <header class="app-header">
      <div class="brand"><h1>Multy</h1><span class="subtitle">Serial communication assistant</span></div>
      <div class="header-actions"><span class="hardware-badge"><span aria-hidden="true">▧</span> ESP32-S3 N16R8</span><span class="hardware-badge board">DevKitC v1</span><button class="icon-button" id="theme-toggle" aria-label="Switch to dark theme" title="Switch theme"></button><button class="icon-button" id="refresh-app" aria-label="Refresh Multy" title="Refresh Multy"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg></button></div>
    </header>

    <section class="connection" aria-label="Connection settings">
      <div class="connection-choice"><span class="desktop-label">Connection</span><div class="transport-switch" role="group" aria-label="Connection method"><button class="transport active" data-transport="serial"><span class="transport-icon" aria-hidden="true">▣</span> PC · USB-serial</button><button class="transport" data-transport="ble"><span class="transport-icon" aria-hidden="true">ᛒ</span> PC / iPhone · BLE</button></div></div>
      <div class="mobile-transport"><span class="mobile-device-icon" aria-hidden="true">ᛒ</span><div><strong id="mobile-transport-name">iPhone · BLE</strong><div id="mobile-status-slot"></div></div></div>
      <div class="port-setting" id="port-setting"><span>Serial port</span><output id="serial-port">Select in Chrome</output></div>
      <button class="primary connect-button" id="connect">Connect</button>
      <span class="connection-status" role="status"><span class="status-dot"></span><span id="connection-status">Disconnected</span></span>
      <p class="connection-help">USB-to-serial connector · PC BLE / iPhone Safari with Beacio over HTTPS</p>
    </section>

    <div class="mobile-navigation">
      <div class="protocol-tabs" role="tablist" aria-label="Interface"><button id="tab-uart" role="tab" aria-selected="true" aria-controls="interface-panel" data-protocol="uart">UART</button><button id="tab-i2c" role="tab" aria-selected="false" aria-controls="interface-panel" tabindex="-1" data-protocol="i2c">I2C</button><button id="tab-spi" role="tab" aria-selected="false" aria-controls="interface-panel" tabindex="-1" data-protocol="spi">SPI</button></div>
      <div class="instance-tabs" role="group" aria-label="Interface instance"><button data-instance="1" class="active" aria-pressed="true">UART1</button><button data-instance="2" aria-pressed="false">UART2</button></div>
    </div>

    <div id="interface-panel" class="interface-grid"></div>
    <footer class="app-footer"><span class="demo-note"><span aria-hidden="true">ⓘ</span> <strong>Multy hardware</strong><span class="footer-detail"> · Connect to Multy firmware</span></span><span class="version">Multy <span>v1.0.0</span></span><span class="ready-status">No device control</span></footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
